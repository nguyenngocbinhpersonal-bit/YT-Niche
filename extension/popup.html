<!doctype html>
<meta charset="utf-8">
<title>niche-finder</title>
<link rel="stylesheet" href="popup.css">
<div class="wrap">
  <h1>niche&#8209;finder</h1>
  <div id="status" class="status">checking the connection…</div>

  <label class="field">
    <span>Local backend address</span>
    <input id="baseUrl" type="text" spellcheck="false" placeholder="http://127.0.0.1:8080">
  </label>

  <label class="field">
    <span>Access token (only if sign-in is enabled on the server)</span>
    <input id="apiToken" type="password" spellcheck="false" autocomplete="off" placeholder="nf_…">
  </label>

  <label class="check">
    <input id="autoFetch" type="checkbox">
    <span>Fetch from the YouTube API what is not in the database
      <em>1-2 units per page, data is saved locally</em></span>
  </label>

  <label class="check">
    <input id="showBadges" type="checkbox">
    <span>Multiplier badges on video cards</span>
  </label>

  <label class="check">
    <input id="onlyOutliers" type="checkbox">
    <span>Show a badge only for outliers (from ×1.5)</span>
  </label>

  <label class="check">
    <input id="showVph" type="checkbox">
    <span>A second badge — views per hour
      <em>under the thumbnail, in blue; over 24h if there is history, otherwise all time</em></span>
  </label>

  <details class="md-details" id="alertsDetails">
    <summary>Alerts <span id="alertsCount"></span></summary>
    <div class="md-form">
      <div id="alertsBody" class="md-result"><div class="md-summary">loading…</div></div>
      <div class="row">
        <button id="alertsScan" class="btn" type="button">Check now</button>
        <button id="alertsMarkSeen" class="btn ghost" type="button">Mark as read</button>
      </div>
    </div>
  </details>

  <details class="md-details">
    <summary>Draft metadata review</summary>
    <div class="md-form">
      <label class="field">
        <span>Title</span>
        <input id="mdTitle" type="text" placeholder="5 neural network secrets nobody talks about">
      </label>
      <label class="field">
        <span>Description</span>
        <textarea id="mdDesc" rows="2" placeholder="00:00 intro..."></textarea>
      </label>
      <label class="field">
        <span>Tags (comma-separated)</span>
        <input id="mdTags" type="text" placeholder="neural networks, ai">
      </label>
      <label class="field">
        <span>Niche</span>
        <input id="mdNiche" type="text" placeholder="ai-explainers">
      </label>
      <label class="field">
        <span>Channel ID (optional)</span>
        <input id="mdChannel" type="text" placeholder="UC...">
      </label>
      <label class="check"><input id="mdShort" type="checkbox"><span>Shorts</span></label>
      <div class="row">
        <button id="mdReview" class="btn" type="button">Check</button>
        <button id="mdSave" class="btn ghost" type="button">Save draft</button>
      </div>
      <div id="mdResult" class="md-result"></div>
    </div>
  </details>

  <div class="row">
    <button id="check" class="btn">Check connection</button>
    <a id="dash" class="btn ghost" target="_blank" rel="noopener">Dashboard</a>
  </div>
  <div class="foot">Data does not leave your computer: the extension talks only to localhost.</div>
</div>
<script src="popup.js"></script>
